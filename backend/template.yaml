AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TaskOps workflow generation API backed by Amazon Bedrock Converse, with Amazon Cognito sign-in and per-user workspaces in DynamoDB.

Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin allowed to call the API. Use a concrete HTTPS origin when the dashboard is hosted.
  ModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
  MaxOutputTokens:
    Type: Number
    Default: 1200
    MinValue: 256
    MaxValue: 1600
  DailyQuota:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
    Description: Maximum Bedrock generations per signed-in user per UTC day. Enforced in Lambda so workspace sync does not consume it.
  ApiDailyQuota:
    Type: Number
    Default: 10000
    MinValue: 1
    MaxValue: 1000000
    Description: API Gateway usage-plan quota for every route, including workspace sync.
  AlarmEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Leave empty or provide an email address.
    Description: Optional email for CloudWatch alarm notifications. Leave empty to create alarms without a subscription.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  TaskOpsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      StageName: prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,PUT,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Api-Key,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
        MaxAge: "'600'"
      Auth:
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Per-client quota and throttle for TaskOps. Bedrock generations are capped separately in Lambda.
          Quota:
            Limit: !Ref ApiDailyQuota
            Period: DAY
          Throttle:
            BurstLimit: 10
            RateLimit: 5
          UsagePlanName: !Sub '${AWS::StackName}-usage'
        Authorizers:
          CognitoAuthorizer:
            Type: COGNITO_USER_POOLS
            UserPoolArn: !GetAtt TaskOpsUserPool.Arn
            IdentitySource: method.request.header.Authorization
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization'"
      Models:
        WorkflowRequest:
          type: object
          additionalProperties: false
          required:
            - goal
          properties:
            goal:
              type: string
              minLength: 3
              maxLength: 600
            category:
              type: string
              enum:
                - auto
                - research
                - study
                - development
                - planning
        AdjustPlanRequest:
          type: object
          additionalProperties: false
          required:
            - instruction
            - steps
          properties:
            instruction:
              type: string
              minLength: 3
              maxLength: 300
            title:
              type: string
              maxLength: 80
            category:
              type: string
              enum:
                - research
                - study
                - development
                - planning
            steps:
              type: array
              minItems: 1
              maxItems: 30
              items:
                type: string
                minLength: 1
                maxLength: 150

  WorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-workflow'
      Description: Generates validated TaskOps workflows with Amazon Nova 2 Lite.
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          DAILY_QUOTA: !Ref DailyQuota
          JIRA_SECRET_ARN: !Ref JiraSecret
          MAX_OUTPUT_TOKENS: !Ref MaxOutputTokens
          MODEL_ID: !Ref ModelId
          STATE_TABLE_NAME: !Ref TaskOpsStateTable
      Policies:
        - Statement:
            - Sid: InvokeTaskOpsModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}'
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0'
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskOpsStateTable
        - Statement:
            - Sid: ReadJiraSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JiraSecret
      Events:
        GenerateWorkflow:
          Type: Api
          Properties:
            RestApiId: !Ref TaskOpsApi
            Path: /workflow
            Method: post
            Auth:
              ApiKeyRequired: true
              Authorizer: CognitoAuthorizer
            RequestModel:
              Model: WorkflowRequest
              Required: true
              ValidateBody: true
              ValidateParameters: false
        GetState:
          Type: Api
          Properties:
            RestApiId: !Ref TaskOpsApi
            Path: /state
            Method: get
            Auth:
              ApiKeyRequired: true
              Authorizer: CognitoAuthorizer
        PutState:
          Type: Api
          Properties:
            RestApiId: !Ref TaskOpsApi
            Path: /state
            Method: put
            Auth:
              ApiKeyRequired: true
              Authorizer: CognitoAuthorizer
        AdjustPlan:
          Type: Api
          Properties:
            RestApiId: !Ref TaskOpsApi
            Path: /workflow/adjust
            Method: post
            Auth:
              ApiKeyRequired: true
              Authorizer: CognitoAuthorizer
            RequestModel:
              Model: AdjustPlanRequest
              Required: true
              ValidateBody: true
              ValidateParameters: false
        CreateJiraIssues:
          Type: Api
          Properties:
            RestApiId: !Ref TaskOpsApi
            Path: /workflow/jira
            Method: post
            Auth:
              ApiKeyRequired: true
              Authorizer: CognitoAuthorizer

  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-workflow'
      RetentionInDays: 14

  TaskOpsStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-state'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: clientId
          AttributeType: S
      KeySchema:
        - AttributeName: clientId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: TaskOps

  TaskOpsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: TaskOps verification code
        EmailMessage: 'Your TaskOps verification code is {####}. It expires in 24 hours.'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      DeletionProtection: INACTIVE
      UserPoolTags:
        Project: TaskOps

  TaskOpsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-web'
      UserPoolId: !Ref TaskOpsUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
      WriteAttributes:
        - email

  JiraSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/jira'
      Description: Jira Cloud credentials for push-only TaskOps export. Replace the generated value with JSON keys baseUrl, email, apiToken, and projectKey.
      GenerateSecretString:
        SecretStringTemplate: '{"baseUrl":"","email":"","projectKey":""}'
        GenerateStringKey: apiToken
        PasswordLength: 32
        ExcludePunctuation: true

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'
      Subscription:
        - Endpoint: !Ref AlarmEmail
          Protocol: email

  # AWS Budgets is intentionally not declared here. It is account-scoped and
  # collides or fails on many existing accounts. See backend/README.md.
  WorkflowErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-workflow-errors'
      AlarmDescription: TaskOps workflow Lambda reported at least one error in a 5-minute period.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkflowFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

  WorkflowThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-workflow-throttles'
      AlarmDescription: TaskOps workflow Lambda was throttled at least once in a 5-minute period.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref WorkflowFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref 'AWS::NoValue']

Outputs:
  ApiEndpoint:
    Description: TaskOps workflow generation endpoint.
    Value: !Sub 'https://${TaskOpsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/workflow'
  ApiKeyId:
    Description: Retrieve the value with aws apigateway get-api-key --include-value.
    Value: !Ref TaskOpsApiApiKey
  ApiId:
    Value: !Ref TaskOpsApi
  UserPoolId:
    Description: Cognito user pool that authenticates dashboard and extension users.
    Value: !Ref TaskOpsUserPool
  UserPoolClientId:
    Description: Public Cognito app client ID used by the dashboard and extension (no client secret).
    Value: !Ref TaskOpsUserPoolClient
  CognitoRegion:
    Value: !Ref AWS::Region
  LambdaFunctionName:
    Value: !Ref WorkflowFunction
  ModelId:
    Value: !Ref ModelId
  StateTableName:
    Value: !Ref TaskOpsStateTable
  JiraSecretArn:
    Description: Replace this secret with Jira baseUrl, email, apiToken, and projectKey before using Send to Jira.
    Value: !Ref JiraSecret
  ErrorsAlarmName:
    Value: !Ref WorkflowErrorsAlarm
  ThrottlesAlarmName:
    Value: !Ref WorkflowThrottlesAlarm
